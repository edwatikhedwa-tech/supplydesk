# First source of truth for "which server am I starting/using" — check this
# block before choosing a start command or port. Two mutually exclusive
# modes only; do not invent a third without an owner task.
runtime_modes:
  LOCAL_CANONICAL:
    purpose: the owner's normal local backend session; real provider credentials only by explicit owner task
    start_command: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\start_local_canonical.ps1 -Apply
    prerequisite: .env at repo root (workspace_policy.local_default_workspace), loaded by backend/app_config.py's load_dotenv
    base_url: http://127.0.0.1:8000
    database: canonical (mail-data/supplier.sqlite3, protected_local_path)
    runbook: docs/operations/runbooks/RUNBOOK-BACKEND-STARTUP.md
  SAFE_TEST:
    purpose: tests/browser/diagnostics only — never the owner's normal work session
    start_command: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\start_test_runtime.ps1 -Apply -Purpose SAFE_TEST
    default_port: 18000
    database: disposable (runtime/test-data/supplier.sqlite3)
    credentials: none — start_test_runtime.ps1 blanks real provider keys itself
    runbook: docs/testing/TEST_ENVIRONMENT.md

runtime_guard:
  command: python scripts/runtime_guard.py
  purpose_values: [OWNER_SESSION, VISUAL_ACCEPTANCE, SAFE_TEST, AUTOMATED_TEST, OAUTH_CHECK, MAIL_PROVIDER_CHECK]
  selection_matrix:
    OWNER_SESSION: LOCAL_CANONICAL
    VISUAL_ACCEPTANCE: LOCAL_CANONICAL
    SAFE_TEST: SAFE_TEST
    AUTOMATED_TEST: SAFE_TEST
    OAUTH_CHECK: LOCAL_CANONICAL
    MAIL_PROVIDER_CHECK: LOCAL_CANONICAL
  mismatch_behavior: FAIL_AND_STOP
  fallback_to_safe_test: forbidden_without_explicit_owner_decision
  browser_metadata: [RUNTIME_PURPOSE, RUNTIME_MODE, BASE_URL, DATABASE_CLASS, AUTH_MODE]

