  public_shell_base_url: http://127.0.0.1:5173
  live_route_base_url: http://127.0.0.1:8000
  audit_live_route_url: http://127.0.0.1:18000
  route_mocks_for_live_acceptance: false
  real_email_actions: forbidden
  safe_browser_actions_only: true

