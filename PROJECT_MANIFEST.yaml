  doctor_dry_run_writes: false
  migrations_in_this_baseline: false
  published: false

operator_tools:
  - path: scripts/doctor.ps1
    classification: TRACK_TOOLING
    modes: [Plan, DryRun, Apply]
    dry_run_observed: PASS_ON_SOURCE_CHECKOUT
    apply_executed: false
  - path: scripts/bootstrap_supplydesk.ps1
    classification: TRACK_TOOLING
  - path: scripts/recover_supplydesk.ps1
    classification: TRACK_TOOLING
  - path: scripts/process_request_step.py
    classification: TRACK_TOOLING
  - path: scripts/runtime_status.py
    classification: TRACK_TOOLING
  - path: scripts/supplier_identity_audit.py
    classification: TRACK_TOOLING
  - path: scripts/verify_enrichment_live.py
    classification: TRACK_TOOLING
  - path: scripts/cross_provider_retry_preview.py
    classification: TRACK_TOOLING

tracked_test_contract:
  backend_command: powershell -ExecutionPolicy Bypass -File .\tests\run-tests.ps1
  backend_diagnostic_command: powershell -ExecutionPolicy Bypass -File .\tests\run-tests.ps1 -Diagnostics
  offline_fixture: benchmarks/enrichment_cases.json
  frontend_install: npm ci --no-audit --fund=false
  frontend_typecheck: npm run typecheck
  frontend_lint: npm run lint
  frontend_build: npm run build
  public_shell: AUDIT_BASE_URL=http://127.0.0.1:5173 npx playwright test tests/frontend-audit.spec.ts -g "public shell" --workers=1
  live_email_tests: not executed; no real mailbox or SMTP access

testing:
  python_runtime_requirements: requirements.txt
  python_test_requirements: requirements-test.txt
  backend_runner: tests/run-tests.ps1
  setup: scripts/setup_test_env.ps1
  environment_doc: docs/testing/TEST_ENVIRONMENT.md
  external_network_default: forbidden
  canonical_database_allowed: false
  real_mail_allowed: false
  runtime_profile: OFFLINE_TEST
  safe_runtime_start: scripts/start_test_runtime.ps1
  safe_runtime_stop: scripts/stop_test_runtime.ps1
  python_test_runner: scripts/run_test_suite.py

protected_local_paths:
  - .env
  - .env.*
  - .vercel/.env.*
  - mail-data/**
  - runtime/**
  - Temp/**
  - frontend/node_modules/**
  - frontend/dist/**
  - artifacts/**
  - .pytest_cache/**
  - __pycache__/**

not_canonicalized:
  - review packages, backup directories and zip bundles
  - captured real-mail fixtures and diagnostic code
  - generated lookup output and local screenshots
  - frontend review candidates and direct lighthouse dev dependency (REVIEW_REQUIRED)

dangerous_operations:
  - send_real_email
  - connect_to_real_smtp_or_imap
  - apply_database_migration
  - write_to_canonical_database
  - delete_or_move_unallowlisted_files
  - force_push
  - merge_or_change_default_branch

