schema_version: 1
test_catalog:
  - id: TEST-DIAG-001
    path: tests/diagnostics/test_diagnostic_runner.py
    kind: unit
    scope: диагностический статус и безопасные проверки
  - id: TEST-DIAG-002
    path: tests/diagnostics/test_doctor_contract.py
    kind: contract
    scope: режимы PowerShell doctor и манифест
  - id: TEST-DIAG-003
    path: tests/diagnostics/test_diagnostic_negative_fixtures.py
    kind: negative
    scope: контролируемые диагностические сбои, классификация секретов и безопасность машинного вывода
  - id: TEST-BACKEND-001
    path: tests/
    kind: regression
    scope: унаследованный набор backend и почты
    baseline: 373 passed, 1 skipped
  - id: TEST-DISCOVERY-001
    path: supplier_discovery_v2/tests/
    kind: unit
    scope: планирование запросов, сопоставление, пайплайн фикстур и хранение
  - id: TEST-FRONTEND-001
    path: frontend/tests/frontend-audit.spec.ts
    kind: browser
    scope: публичная оболочка
    inherited_evidence: 8 passed
  - id: TEST-FRONTEND-002
    path: frontend/tests/email-renderer-responsive.spec.ts
    kind: browser
    scope: рендеринг содержимого на адаптивных ширинах экрана
  - id: TEST-MAIL-001
    path: tests/test_mail_deliverability.py
    kind: integration
    scope: предпроверка, подавление, дозирование и семантика gate провайдера
  - id: TEST-MAIL-002
    path: tests/test_mail_integrity.py
    kind: integration
    scope: идемпотентность, авторизация, атомарность и захват очереди
  - id: TEST-MAIL-003
    path: tests/test_mail_status_semantics.py
    kind: integration
    scope: оси доставки и безопасность повторов
  - id: TEST-RUNTIME-001
    path: tests/test_canonical_runtime.py
    kind: unit
    scope: канонический lock и происхождение
  - id: TEST-ENV-001
    path: tests/diagnostics/test_reproducible_environment.py
    kind: negative
    scope: профиль OFFLINE_TEST, отказ одноразовой базы данных и безопасность провайдера/сети
  - id: TEST-ENV-002
    path: scripts/run_test_suite.py
    kind: runner
    scope: точка входа регрессии unittest только через loopback
