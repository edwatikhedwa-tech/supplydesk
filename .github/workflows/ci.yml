name: SupplyDesk CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Verification profile to run manually
        required: true
        type: choice
        options:
          - FAST
          - FULL
        default: FULL
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: supplydesk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast_control:
    name: SupplyDesk / Fast Control
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert checked-out workspace
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\assert_workspace.ps1" -ExpectedRoot "$env:GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install declared test requirements
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-test.txt

      - name: Validate VibeCoding policy
        shell: pwsh
        run: python ai/tools/validate_vibecoding.py

      - name: Validate documentation
        shell: pwsh
        run: python ai/tools/validate_docs.py

      - name: Validate state
        shell: pwsh
        run: python ai/tools/validate_state.py

      - name: Validate traceability
        shell: pwsh
        run: python ai/tools/validate_traceability.py

      - name: Run diagnostic and control tests
        shell: pwsh
        run: python -m unittest discover -s tests/diagnostics -v

      - name: Check Git and protected-path safety
        shell: pwsh
        run: |
          git diff --check
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -gt 0) {
            Write-Error ('Unexpected staged paths: ' + ($staged -join ', '))
          }
          $tracked = @(git ls-files | ForEach-Object { $_ -replace '\\', '/' })
          $protected = $tracked | Where-Object {
            $_ -match '(^|/)\.env($|\.)' -or
            $_ -match '(^|/)mail-data/' -or
            $_ -match '(^|/)runtime/' -or
            $_ -match '\.(sqlite3|db)$' -or
            $_ -match '(^|/)(quarantine|SupplyDesk_Quarantine)/'
          }
          if ($protected.Count -gt 0) {
            Write-Error ('Protected tracked paths found: ' + ($protected -join ', '))
          }
          Write-Output '[PASS] Git diff, staged-path and protected-path checks passed.'

  change_classification:
    name: SupplyDesk / Change Classification
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      event_name: ${{ steps.classify.outputs.event_name }}
      profile: ${{ steps.classify.outputs.profile }}
      risk: ${{ steps.classify.outputs.risk }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      backend: ${{ steps.classify.outputs.backend }}
      backend_fast: ${{ steps.classify.outputs.backend_fast }}
      backend_full: ${{ steps.classify.outputs.backend_full }}
      frontend: ${{ steps.classify.outputs.frontend }}
      frontend_required: ${{ steps.classify.outputs.frontend_required }}
      browser: ${{ steps.classify.outputs.browser }}
      browser_smoke: ${{ steps.classify.outputs.browser_smoke }}
      browser_full: ${{ steps.classify.outputs.browser_full }}
      high_risk: ${{ steps.classify.outputs.high_risk }}
      control: ${{ steps.classify.outputs.control }}
      doctor_required: ${{ steps.classify.outputs.doctor_required }}
      unknown: ${{ steps.classify.outputs.unknown }}
      full_required: ${{ steps.classify.outputs.full_required }}
      full_all: ${{ steps.classify.outputs.full_all }}
      jobs_required: ${{ steps.classify.outputs.jobs_required }}
      jobs_skipped: ${{ steps.classify.outputs.jobs_skipped }}
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert checked-out workspace
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\assert_workspace.ps1" -ExpectedRoot "$env:GITHUB_WORKSPACE"

      - name: Classify changed paths deterministically
        id: classify
        shell: pwsh
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          CI_PROFILE: ${{ inputs.profile }}
        run: pwsh -NoProfile -File .\scripts\ci\classify_changes.ps1 -BaseRef $env:BASE_REF -EventName $env:EVENT_NAME -Profile $env:CI_PROFILE

  backend_fast:
    name: SupplyDesk / Backend Fast
    needs:
      - fast_control
      - change_classification
    if: >-
      needs.fast_control.result == 'success' &&
      needs.change_classification.outputs.backend_fast == 'true'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert checked-out workspace
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\assert_workspace.ps1" -ExpectedRoot "$env:GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install declared test requirements
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-test.txt

      - name: Run official focused backend checks
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests.ps1 -Quick -PythonPath $python -ExpectedRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  backend_full:
    name: SupplyDesk / Backend Full
    needs:
      - fast_control
      - change_classification
    if: >-
      needs.fast_control.result == 'success' &&
      needs.change_classification.outputs.backend_full == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert checked-out workspace
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\assert_workspace.ps1" -ExpectedRoot "$env:GITHUB_WORKSPACE"

      # This suite creates a disposable SQLite tempfile.TemporaryDirectory() per
      # test. On GitHub-hosted Windows runners, Defender's real-time scan of
      # every such file write/read is a well-known, well-documented cause of
      # large slowdowns for I/O-heavy suites; excluding the ephemeral runner's
      # own workspace/temp paths is a standard, no-risk mitigation (the VM is
      # destroyed after the job). Best-effort only: never fails the job.
      - name: Exclude workspace and temp from Windows Defender scanning
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
            Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP" -ErrorAction Stop
            Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction Stop
            Write-Host "Defender exclusions added for workspace and temp paths."
          } catch {
            Write-Host "Defender exclusion step skipped (not available on this runner): $_"
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install declared test requirements
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-test.txt

      - name: Run official backend regression
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests.ps1 -Full -PythonPath $python -ExpectedRoot $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  frontend:
    name: SupplyDesk / Frontend
    needs:
      - fast_control
      - change_classification
    if: >-
      needs.fast_control.result == 'success' &&
      needs.change_classification.outputs.frontend_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert checked-out workspace
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\assert_workspace.ps1" -ExpectedRoot "$env:GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install
        shell: pwsh
        run: npm ci --no-audit --fund=false

      - name: Typecheck
        shell: pwsh
        run: npm run typecheck

      - name: Lint
        shell: pwsh
        run: npm run lint

      - name: Build
        shell: pwsh
        run: npm run build

  browser_smoke:
    name: SupplyDesk / Browser Smoke
    needs:
      - fast_control
      - change_classification
    if: >-
      needs.fast_control.result == 'success' &&
      needs.change_classification.outputs.browser_smoke == 'true'
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert checked-out workspace
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\assert_workspace.ps1" -ExpectedRoot "$env:GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Create isolated test environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\setup_test_env.ps1 -Apply -ExpectedRoot $env:GITHUB_WORKSPACE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install frontend
        shell: pwsh
        working-directory: frontend
        run: npm ci --no-audit --fund=false

      - name: Build frontend shell for application runtime
        shell: pwsh
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for Playwright
        shell: pwsh
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run real-route FAST browser smoke
        shell: pwsh
        run: |
          $exitCode = 0
          try {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\start_test_runtime.ps1 -Apply -Purpose AUTOMATED_TEST -Port 18000 -WaitSeconds 60 -ExpectedRoot $env:GITHUB_WORKSPACE
            if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
            if ($exitCode -eq 0) {
              Push-Location frontend
              try {
                $env:RUNTIME_PURPOSE = 'AUTOMATED_TEST'
                $env:RUNTIME_MODE = 'SAFE_TEST'
                $env:RUNTIME_BACKEND_URL = 'http://127.0.0.1:18000'
                $env:AUDIT_BASE_URL = 'http://127.0.0.1:18000'
                npx playwright test tests/fast-browser-smoke.spec.ts --project=desktop-compact --reporter=line
                $exitCode = $LASTEXITCODE
              } finally {
                Pop-Location
              }
            }
          } finally {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\stop_test_runtime.ps1 -Apply -ExpectedRoot $env:GITHUB_WORKSPACE
          }
          exit $exitCode

      - name: Upload smoke evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supplydesk-browser-smoke-failure-evidence
          path: |
            frontend/test-results
            frontend/artifacts
          if-no-files-found: ignore

  browser_full:
    name: SupplyDesk / Browser Full
    needs:
      - fast_control
      - change_classification
    if: >-
      needs.fast_control.result == 'success' &&
      needs.change_classification.outputs.browser_full == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert checked-out workspace
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\assert_workspace.ps1" -ExpectedRoot "$env:GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Create isolated test environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\setup_test_env.ps1 -Apply -ExpectedRoot $env:GITHUB_WORKSPACE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install frontend
        shell: pwsh
        working-directory: frontend
        run: npm ci --no-audit --fund=false

      - name: Build frontend shell for application runtime
        shell: pwsh
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for Playwright
        shell: pwsh
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run safe runtime and FULL browser acceptance
        shell: pwsh
        run: |
          $exitCode = 0
          try {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\start_test_runtime.ps1 -Apply -Purpose AUTOMATED_TEST -Port 18000 -WaitSeconds 60 -ExpectedRoot $env:GITHUB_WORKSPACE
            if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
            if ($exitCode -eq 0) {
              Push-Location frontend
              try {
                $env:RUNTIME_PURPOSE = 'AUTOMATED_TEST'
                $env:RUNTIME_MODE = 'SAFE_TEST'
                $env:RUNTIME_BACKEND_URL = 'http://127.0.0.1:18000'
                $env:AUDIT_BASE_URL = 'http://127.0.0.1:18000'
                npx playwright test tests/frontend-audit.spec.ts -g 'public shell'
                $exitCode = $LASTEXITCODE
              } finally {
                Pop-Location
              }
            }
          } finally {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\stop_test_runtime.ps1 -Apply -ExpectedRoot $env:GITHUB_WORKSPACE
          }
          exit $exitCode

      - name: Upload full browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supplydesk-browser-full-failure-evidence
          path: |
            frontend/test-results
            frontend/artifacts
          if-no-files-found: ignore

  full_control:
    name: SupplyDesk / Full Control
    needs:
      - fast_control
      - change_classification
    if: >-
      needs.fast_control.result == 'success' &&
      needs.change_classification.outputs.doctor_required == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert checked-out workspace
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File "$env:GITHUB_WORKSPACE\scripts\assert_workspace.ps1" -ExpectedRoot "$env:GITHUB_WORKSPACE"

      - name: Run read-only Doctor plan
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\doctor.ps1 -Plan -ExpectedRoot $env:GITHUB_WORKSPACE

  ci_summary:
    name: SupplyDesk / CI Summary
    needs:
      - fast_control
      - change_classification
      - backend_fast
      - backend_full
      - frontend
      - browser_smoke
      - browser_full
      - full_control
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish owner summary
        shell: bash
        env:
          RISK: ${{ needs.change_classification.outputs.risk }}
          PROFILE: ${{ needs.change_classification.outputs.profile }}
          REQUIRED: ${{ needs.change_classification.outputs.jobs_required }}
          SKIPPED: ${{ needs.change_classification.outputs.jobs_skipped }}
          FAST_RESULT: ${{ needs.fast_control.result }}
          CLASSIFIER_RESULT: ${{ needs.change_classification.result }}
          BACKEND_FAST_RESULT: ${{ needs.backend_fast.result }}
          BACKEND_FULL_RESULT: ${{ needs.backend_full.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BROWSER_SMOKE_RESULT: ${{ needs.browser_smoke.result }}
          BROWSER_FULL_RESULT: ${{ needs.browser_full.result }}
          DOCTOR_RESULT: ${{ needs.full_control.result }}
        run: |
          {
            echo '## SupplyDesk CI Summary'
            echo "- Risk: ${RISK:-NOT_VERIFIED}"
            echo "- Profile: ${PROFILE:-NOT_VERIFIED}"
            echo "- Jobs required: ${REQUIRED:-NOT_VERIFIED}"
            echo "- Jobs skipped: ${SKIPPED:-NOT_VERIFIED}"
            echo "- Fast Control: ${FAST_RESULT}"
            echo "- Change Classification: ${CLASSIFIER_RESULT}"
            echo "- Backend Fast: ${BACKEND_FAST_RESULT}"
            echo "- Backend Full: ${BACKEND_FULL_RESULT}"
            echo "- Frontend: ${FRONTEND_RESULT}"
            echo "- Browser Smoke: ${BROWSER_SMOKE_RESULT}"
            echo "- Browser Full: ${BROWSER_FULL_RESULT}"
            echo "- Full Control: ${DOCTOR_RESULT}"
            echo '- Total wall-clock: see completed job timestamps above; skipped jobs are NOT_NEEDED.'
          } >> "$GITHUB_STEP_SUMMARY"
