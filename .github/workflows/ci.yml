name: SupplyDesk CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Verification profile to run manually
        required: true
        type: choice
        options:
          - FAST
          - FULL
        default: FULL

permissions:
  contents: read

concurrency:
  group: supplydesk-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast_control:
    name: SupplyDesk / Fast Control
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install declared test requirements
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-test.txt

      - name: Validate VibeCoding policy
        shell: pwsh
        run: python ai/tools/validate_vibecoding.py

      - name: Validate documentation
        shell: pwsh
        run: python ai/tools/validate_docs.py

      - name: Validate state
        shell: pwsh
        run: python ai/tools/validate_state.py

      - name: Validate traceability
        shell: pwsh
        run: python ai/tools/validate_traceability.py

      - name: Run diagnostic and control tests
        shell: pwsh
        run: python -m unittest discover -s tests/diagnostics -v

      - name: Check Git and protected-path safety
        shell: pwsh
        run: |
          git diff --check
          $staged = @(git diff --cached --name-only)
          if ($staged.Count -gt 0) {
            Write-Error ('Unexpected staged paths: ' + ($staged -join ', '))
          }
          $tracked = @(git ls-files | ForEach-Object { $_ -replace '\\', '/' })
          $protected = $tracked | Where-Object {
            $_ -match '(^|/)\.env($|\.)' -or
            $_ -match '(^|/)mail-data/' -or
            $_ -match '(^|/)runtime/' -or
            $_ -match '\.(sqlite3|db)$' -or
            $_ -match '(^|/)(quarantine|SupplyDesk_Quarantine)/'
          }
          if ($protected.Count -gt 0) {
            Write-Error ('Protected tracked paths found: ' + ($protected -join ', '))
          }
          Write-Output '[PASS] Git diff, staged-path and protected-path checks passed.'

  change_classification:
    name: SupplyDesk / Change Classification
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      browser: ${{ steps.classify.outputs.browser }}
      high_risk: ${{ steps.classify.outputs.high_risk }}
      control: ${{ steps.classify.outputs.control }}
      unknown: ${{ steps.classify.outputs.unknown }}
      full_required: ${{ steps.classify.outputs.full_required }}
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths deterministically
        id: classify
        shell: pwsh
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pwsh -NoProfile -File .\scripts\ci\classify_changes.ps1 -BaseRef $env:BASE_REF

  backend:
    name: SupplyDesk / Backend
    needs:
      - fast_control
      - change_classification
    if: >-
      needs.fast_control.result == 'success' &&
      (needs.change_classification.outputs.backend == 'true' ||
       needs.change_classification.outputs.unknown == 'true' ||
       needs.change_classification.outputs.full_required == 'true' ||
       (github.event_name == 'pull_request' && needs.change_classification.outputs.backend == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.profile == 'FULL'))
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install declared test requirements
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-test.txt

      - name: Run official backend regression
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          & pwsh -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests.ps1 -Full -PythonPath $python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  frontend:
    name: SupplyDesk / Frontend
    needs:
      - fast_control
      - change_classification
    if: >-
      needs.fast_control.result == 'success' &&
      (needs.change_classification.outputs.frontend == 'true' ||
       needs.change_classification.outputs.unknown == 'true' ||
       needs.change_classification.outputs.full_required == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.profile == 'FULL'))
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install
        shell: pwsh
        run: npm ci --no-audit --fund=false

      - name: Typecheck
        shell: pwsh
        run: npm run typecheck

      - name: Lint
        shell: pwsh
        run: npm run lint

      - name: Build
        shell: pwsh
        run: npm run build

  browser:
    name: SupplyDesk / Browser
    needs:
      - fast_control
      - change_classification
    if: >-
      needs.fast_control.result == 'success' &&
      (needs.change_classification.outputs.browser == 'true' ||
       needs.change_classification.outputs.frontend == 'true' ||
       needs.change_classification.outputs.unknown == 'true' ||
       needs.change_classification.outputs.full_required == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.profile == 'FULL'))
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Create isolated test environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\setup_test_env.ps1 -Apply

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install frontend
        shell: pwsh
        working-directory: frontend
        run: npm ci --no-audit --fund=false

      - name: Build frontend shell for application runtime
        shell: pwsh
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for Playwright
        shell: pwsh
        working-directory: frontend
        run: npx playwright install chromium

      - name: Run safe runtime and real-route Playwright
        shell: pwsh
        run: |
          $exitCode = 0
          try {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\start_test_runtime.ps1 -Apply -Port 18000 -WaitSeconds 60
            if ($LASTEXITCODE -ne 0) { $exitCode = $LASTEXITCODE }
            if ($exitCode -eq 0) {
              Push-Location frontend
              try {
                $env:AUDIT_BASE_URL = 'http://127.0.0.1:18000'
                npx playwright test tests/frontend-audit.spec.ts -g 'public shell' --reporter=line
                $exitCode = $LASTEXITCODE
              } finally {
                Pop-Location
              }
            }
          } finally {
            & pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\stop_test_runtime.ps1 -Apply
          }
          exit $exitCode

      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supplydesk-browser-failure-evidence
          path: |
            frontend/test-results
            frontend/artifacts
          if-no-files-found: ignore

  full_control:
    name: SupplyDesk / Full Control
    needs:
      - fast_control
      - change_classification
    if: >-
      needs.fast_control.result == 'success' &&
      (github.event_name == 'pull_request' ||
       needs.change_classification.outputs.full_required == 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.profile == 'FULL'))
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout clean repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run read-only Doctor plan
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\doctor.ps1 -Plan
